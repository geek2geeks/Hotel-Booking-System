name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  python:
    name: Python checks (self-hosted Windows)
    runs-on: [self-hosted, Windows, X64, Hotel-Booking-System]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create virtual environment
        run: |
          python -m venv --clear .venv

      - name: Upgrade pip
        run: |
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: |
          & .\.venv\Scripts\python.exe -m pip check

      - name: Byte-compile Python sources
        run: |
          & .\.venv\Scripts\python.exe -m compileall -q app run.py migrations

      - name: Smoke test app factory
        run: |
          & .\.venv\Scripts\python.exe -c "from run import app; rules = list(app.url_map.iter_rules()); print('registered routes:', len(rules)); assert rules"
